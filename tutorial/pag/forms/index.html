<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulários</title>
</head>
<body>
    <header id="cabecalho">
        <div id="cabecalho-titulo">FORMULÁRIOS</div>
        <div id="cabecalho-subtitulo"></div>
    </header>
    <main id="principal">
        <form id="formulario" action="#" method="post"></form>
            <div class="campo">
                <label for="nome" id="formulario-nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Informe seu nome completo">
            </div>
            <div class="campo">
                <label for="email" id="formulario-email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>
            <div class="campo">
                <label for="mensagem" id="formulario-mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como posso te ajudar?"></textarea>
            </div>
            <div class="campo">
                <button type="submit" id="botao-enviar">Enviar</button>
            </div>
    </main>
    <footer id="rodape">

    </footer>
</body>
</html>
